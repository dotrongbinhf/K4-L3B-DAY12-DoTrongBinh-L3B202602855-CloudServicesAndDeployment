name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run checkpoint tests
        run: >-
          python -m pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
        env:
          AGENT_API_KEY: ci-dummy-key
          REDIS_URL: fake://

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag day12-agent:ci .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Smoke test deployed service
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' && vars.PUBLIC_URL != '' }}
        run: |
          sleep 45
          curl --fail --silent --show-error "$PUBLIC_URL/health"
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}

      - name: Explain skipped deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "Set the RENDER_DEPLOY_HOOK_URL repository secret to enable automatic Render deploys."
